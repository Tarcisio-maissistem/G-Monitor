# VPS (entrada publica): so HTTPS + repasse para o servidor local (docker/nginx-local-web.conf).
# Arquivo em /etc/nginx/sites-available/gmonitor.maissistem.com.br (certificado gerido pelo certbot).
# G-Monitor — dominio proprio (maissistem.com.br), substituindo gmonitor-pilot.anafood.vip.
# API/WS -> backend no ms-gestor (10.8.0.2:6070, WireGuard). `/` serve o build estatico
# local (apps/web/dist) — mesmo padrao do vhost -pilot.anafood.vip, sem Cloudflare na
# frente (DNS deste dominio e servidorestavel.net, A record direto pro IP do servidor).

# Conexões reaproveitadas até o servidor local (poupa ~137 ms de handshake por request)
upstream gmonitor_local {
    server 10.8.0.2:6071;
    keepalive 16;
}

map $http_upgrade $connection_upgrade_gm {
    default upgrade;
    ''      "";
}

server {
    server_name gmonitor.maissistem.com.br;

    client_max_body_size 10M;

    # 24/09 v1.1.0: G-Monitor mora no SERVIDOR LOCAL (10.8.0.2:6071 = nginx em container
    # que serve a tela e repassa a API). Aqui só o HTTPS + repasse; nenhum arquivo do G-Monitor na VPS.
    location / {
        proxy_pass http://gmonitor_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # WebSocket dos agentes (/ws/agent)
        proxy_set_header Connection $connection_upgrade_gm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gmonitor.maissistem.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gmonitor.maissistem.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = gmonitor.maissistem.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name gmonitor.maissistem.com.br;

    listen 80;
    return 404; # managed by Certbot


}