# G-Monitor — backend PILOTO (temporario). Proxy pra PM2 gmonitor-backend-pilot em 127.0.0.1:6070.
# Cert: wildcard *.anafood.vip (mesmo dos demais vhosts). Proxy Cloudflare na frente.
# Instalar: sudo cp docker/nginx-pilot-vhost.conf /etc/nginx/sites-available/gmonitor-pilot.anafood.vip
#           sudo ln -s /etc/nginx/sites-available/gmonitor-pilot.anafood.vip /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

server {
    server_name gmonitor-pilot.anafood.vip;

    include /etc/nginx/cloudflare-ips.conf;

    client_max_body_size 10M;

    location /ws/agent {
        proxy_pass http://127.0.0.1:6070/ws/agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:6070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/anafood.vip-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anafood.vip-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name gmonitor-pilot.anafood.vip;
    return 301 https://$host$request_uri;
}
