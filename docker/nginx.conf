# Nginx reverse proxy do G-Monitor.
# Roteia:
#   app.gmonitor.com.br  -> web (estatico)
#   api.gmonitor.com.br  -> backend HTTP
#   ws.gmonitor.com.br   -> backend WebSocket (mesma porta 6060)

upstream gmonitor_backend {
  server backend:6060;
}
upstream gmonitor_web {
  server web:80;
}

# Redirect HTTP -> HTTPS
server {
  listen 80;
  server_name app.gmonitor.com.br api.gmonitor.com.br ws.gmonitor.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# Frontend (web)
server {
  listen 443 ssl http2;
  server_name app.gmonitor.com.br;
  ssl_certificate /etc/letsencrypt/live/app.gmonitor.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.gmonitor.com.br/privkey.pem;

  location / {
    proxy_pass http://gmonitor_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# API HTTP
server {
  listen 443 ssl http2;
  server_name api.gmonitor.com.br;
  ssl_certificate /etc/letsencrypt/live/api.gmonitor.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.gmonitor.com.br/privkey.pem;

  client_max_body_size 16M;

  location / {
    proxy_pass http://gmonitor_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# WebSocket dos agentes
server {
  listen 443 ssl http2;
  server_name ws.gmonitor.com.br;
  ssl_certificate /etc/letsencrypt/live/ws.gmonitor.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ws.gmonitor.com.br/privkey.pem;

  location /ws/ {
    proxy_pass http://gmonitor_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    return 404;
  }
}
