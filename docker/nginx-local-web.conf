# v1.2.0 (24/09) /downloads do agente | v1.1.0 (24/09) gzip + cache de assets | v1.0.0 (24/09) — G-Monitor: tela + proxy da API no SERVIDOR LOCAL.
# A VPS só termina o HTTPS de gmonitor.maissistem.com.br e repassa tudo para cá (:6071).
# Config PERSISTENTE (nunca em /tmp). No servidor: /home/anafood/gmonitor-web/default.conf
# Container: docker run -d --name gmonitor_web --restart always --network host \
#   -v /home/anafood/gmonitor-web/default.conf:/etc/nginx/conf.d/default.conf:ro \
#   -v /home/anafood/G-Monitor/apps/web:/srv/web:ro \
#   -v /home/anafood/gmonitor-web/downloads:/srv/downloads:ro nginx:alpine
# Build da tela: corepack pnpm --filter @gmonitor/web build
server {
    listen 6071;
    client_max_body_size 10M;

    # Compressão: JSON dos relatórios e JS/CSS da tela viajam comprimidos (o trecho VPS<->local tem 137 ms)
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    # Agentes (WebSocket) -> backend
    location /ws/agent {
        proxy_pass http://127.0.0.1:6070/ws/agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;             # IP real vem da VPS
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API -> backend
    location /api/ {
        proxy_pass http://127.0.0.1:6070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Tela (SPA). Monta a pasta apps/web inteira: o build recria o dist e o mount continua valendo
    root /srv/web/dist;
    index index.html;
    # Instalador/atualizacao do agente (latest.json, .exe, install.ps1): pasta FORA do build
    # (/home/anafood/gmonitor-web/downloads) — o build recria o dist e apagaria os arquivos.
    location /downloads/ {
        alias /srv/downloads/;
        add_header Cache-Control "no-cache";
    }

    # Arquivos do build têm hash no nome -> o navegador guarda por 1 ano e nem pergunta de novo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalida (é ele que aponta para o build novo)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
